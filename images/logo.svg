<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0C94B"/>
      <stop offset="100%" style="stop-color:#D4A017"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2EC4B6"/>
      <stop offset="100%" style="stop-color:#1A9E92"/>
    </linearGradient>
    <linearGradient id="tealLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5DD9CE"/>
      <stop offset="100%" style="stop-color:#2EC4B6"/>
    </linearGradient>
  </defs>

  <!-- Decorative circle behind -->
  <circle cx="70" cy="100" r="60" fill="none" stroke="url(#tealLight)" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>

  <!-- Craft scissors icon -->
  <g transform="translate(44, 68)" fill="url(#tealGrad)">
    <!-- Scissors blades -->
    <ellipse cx="12" cy="8" rx="10" ry="5" transform="rotate(-30 12 8)" />
    <ellipse cx="40" cy="8" rx="10" ry="5" transform="rotate(30 40 8)" />
    <!-- Handles -->
    <circle cx="8" cy="28" r="9" fill="none" stroke="url(#tealGrad)" stroke-width="3"/>
    <circle cx="44" cy="28" r="9" fill="none" stroke="url(#tealGrad)" stroke-width="3"/>
    <!-- Connecting lines -->
    <line x1="16" y1="22" x2="26" y2="12" stroke="url(#tealGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="22" x2="26" y2="12" stroke="url(#tealGrad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Thread/needle -->
    <path d="M26 12 Q26 -5 42 -8 Q58 -10 62 2" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>
    <circle cx="62" cy="2" r="2" fill="url(#goldGrad)"/>
  </g>

  <!-- Star sparkles -->
  <g fill="url(#goldGrad)" opacity="0.7">
    <polygon points="105,45 107,50 112,50 108,53 109,58 105,55 101,58 102,53 98,50 103,50" />
    <polygon points="38,55 39.5,58.5 43,58.5 40,60.7 41,64 38,62 35,64 36,60.7 33,58.5 36.5,58.5" transform="scale(0.7) translate(-5, 10)"/>
  </g>

  <!-- "Made by" text -->
  <text x="135" y="90" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="400" fill="#3A3A3A" letter-spacing="2">
    Made by
  </text>

  <!-- "Liv" text -->
  <text x="310" y="90" font-family="'Playfair Display', Georgia, serif" font-size="48" font-weight="700" fill="url(#goldGrad)" letter-spacing="1">
    Liv
  </text>

  <!-- Decorative underline swash -->
  <path d="M135 102 Q200 102 250 106 Q300 110 380 102 Q400 100 420 105" 
        fill="none" stroke="url(#tealGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M380 102 Q400 100 420 105 L418 100 M420 105 L414 106" 
        fill="none" stroke="url(#tealGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Tagline -->
  <text x="250" y="135" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#1A9E92" text-anchor="middle" letter-spacing="3.5">
    HANDCRAFTED WITH LOVE
  </text>

  <!-- Small decorative dots -->
  <circle cx="155" cy="148" r="2" fill="url(#goldGrad)" opacity="0.5"/>
  <circle cx="250" cy="152" r="1.5" fill="url(#tealGrad)" opacity="0.4"/>
  <circle cx="345" cy="148" r="2" fill="url(#goldGrad)" opacity="0.5"/>
</svg>
